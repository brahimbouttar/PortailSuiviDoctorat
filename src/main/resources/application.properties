spring.application.name=PortailSuiviDoctorat

spring.datasource.url=jdbc:h2:mem:PortailSuiviDoctoratDB
spring.datasource.username=admin
spring.datasource.password=1234
server.port=8081
spring.thymeleaf.cache=false
spring.h2.console.enabled=true

#spring.datasource.url=jdbc:postgresql://localhost:5432/portailsuividoctorat
#spring.datasource.username=postgres
#spring.datasource.password=1234
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.mvc.hiddenmethod.filter.enabled=true
# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=portail-doctorat-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gestion.portailsuividoctorat.*


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB