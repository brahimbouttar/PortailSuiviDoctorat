<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          'Jurys',
          'Gestion des membres de jury',
          'jury'
      )}">
<head><title>Jurys</title></head>
<body>

<section th:fragment="content">
<style>
  /* ── STAT PILL ───────────────────────────────────────────── */
  .stat-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    font-size: .79rem; color: var(--muted);
    margin-bottom: 16px;
  }
  .stat-pill strong { color: var(--text); font-size: .95rem; font-weight: 700; }
  .stat-pill i { color: var(--accent); }

  /* ── TOOLBAR ─────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .search-wrap { flex: 1; max-width: 320px; position: relative; }
  .search-wrap i {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: .78rem; pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 8px 12px 8px 32px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: .81rem; color: var(--text); background: var(--surface);
    font-family: inherit; transition: border-color .12s;
  }
  .search-wrap input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,110,244,.1);
  }

  /* ── BTN ─────────────────────────────────────────────────── */
  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    padding: 7px 14px; border-radius: 6px; font-size: .78rem; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .13s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 5px 11px; border-radius: 6px; font-size: .75rem; font-weight: 500;
    cursor: pointer; transition: all .13s;
  }
  .btn-ghost:hover { border-color: #c7d9fd; color: var(--accent); background: #eff6ff; }

  /* ── TYPE BADGE ──────────────────────────────────────────── */
  .badge-type {
    display: inline-block; font-size: .65rem; font-weight: 600;
    padding: 2px 9px; border-radius: 20px;
    background: #eff6ff; border: 1px solid #c7d9fd; color: var(--accent);
  }

  /* ── ALERTS ──────────────────────────────────────────────── */
  .alert {
    padding: 10px 14px; border-radius: 7px; font-size: .8rem;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; border: 1px solid transparent;
  }
  .alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
  .alert-danger  { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

  /* ── MODAL ───────────────────────────────────────────────── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(15,20,35,.45); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--surface); border-radius: 10px;
    width: 100%; max-width: 480px; max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
    animation: modalIn .18s ease;
  }
  @keyframes modalIn {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .modal-head {
    padding: 15px 20px; background: var(--navy); border-radius: 10px 10px 0 0;
    display: flex; align-items: center; gap: 9px; color: #fff; flex-shrink: 0;
  }
  .modal-head h5 { font-size: .88rem; font-weight: 600; margin: 0; flex: 1; }
  .modal-head .close-btn {
    background: none; border: none; color: rgba(255,255,255,.45);
    font-size: .85rem; cursor: pointer; padding: 2px 5px; transition: color .12s;
  }
  .modal-head .close-btn:hover { color: #fff; }
  .modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
  .modal-foot {
    padding: 13px 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 8px;
    background: var(--bg); border-radius: 0 0 10px 10px; flex-shrink: 0;
  }

  /* ── FORM ────────────────────────────────────────────────── */
  .form-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group  { display: flex; flex-direction: column; gap: 4px; }
  .form-group label {
    font-size: .71rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .form-group input {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: .81rem; color: var(--text);
    background: var(--surface); font-family: inherit; transition: border-color .12s;
  }
  .form-group input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,110,244,.1);
  }

  /* ── FADE ROWS ───────────────────────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: none; }
  }
  tbody tr { animation: fadeUp .2s ease both; }
</style>

  <!-- ALERTS -->
  <div class="alert alert-success" th:if="${successMessage}">
    <i class="fas fa-check-circle"></i>
    <span th:text="${successMessage}"></span>
  </div>
  <div class="alert alert-danger" th:if="${errorMessage}">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${errorMessage}"></span>
  </div>

  <!-- STAT PILL -->
  <div class="stat-pill">
    <i class="fas fa-users"></i>
    <strong th:text="${#lists.size(jurys)}">0</strong> jurys enregistrés
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input id="searchInput" placeholder="Rechercher…" oninput="filterTable()"/>
    </div>
    <button class="btn-primary" onclick="openAdd()">
      <i class="fas fa-plus"></i> Ajouter un jury
    </button>
  </div>

  <!-- TABLE CARD -->
  <div class="card" th:data-create-url="@{/jury/create}">
    <div class="card-head">
      <h6><i class="fas fa-user-tie"></i> Liste des jurys</h6>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>Type</th>
          <th style="text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">

        <tr th:if="${#lists.isEmpty(jurys)}">
          <td colspan="6" style="text-align:center;padding:48px 20px;color:var(--muted);font-size:.8rem">
            <i class="fas fa-folder-open" style="font-size:2rem;color:#d1d5db;display:block;margin-bottom:10px"></i>
            Aucun jury enregistré pour le moment.
          </td>
        </tr>

        <tr th:unless="${#lists.isEmpty(jurys)}"
            th:each="j, stat : ${jurys}"
            th:style="'animation-delay:' + ${stat.index * 25} + 'ms'">
          <td style="color:var(--muted);font-weight:600;font-size:.78rem" th:text="${stat.count}"></td>
          <td style="font-weight:600" th:text="${j.nom}"></td>
          <td th:text="${j.prenom}"></td>
          <td style="color:var(--muted);font-size:.8rem" th:text="${j.email != null ? j.email : '—'}"></td>
          <td>
            <span class="badge-type" th:text="${j.type != null ? j.type : '—'}"></span>
          </td>
          <td>
            <div class="act">
              <button class="act-btn ok" type="button" title="Modifier"
                      th:data-id="${j.id}"
                      th:data-nom="${j.nom}"
                      th:data-prenom="${j.prenom}"
                      th:data-email="${j.email}"
                      th:data-type="${j.type}"
                      th:data-url="@{/jury/update/{id}(id=${j.id})}"
                      onclick="openEdit(this)">
                <i class="fas fa-pencil"></i>
              </button>
              <a th:href="@{/jury/delete/{id}(id=${j.id})}"
                 onclick="return confirm('Supprimer ce jury ?')"
                 style="display:inline-flex">
                <button type="button" class="act-btn no" title="Supprimer">
                  <i class="fas fa-trash"></i>
                </button>
              </a>
            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- ═══ MODAL ═══════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="juryModal" onclick="closeOnBackdrop(event)">
    <div class="modal-box">
      <div class="modal-head">
        <i class="fas fa-user-tie" style="font-size:.82rem"></i>
        <h5 id="modalTitle">Ajouter un jury</h5>
        <button class="close-btn" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="juryForm" method="post">
          <input type="hidden" id="juryId" name="id"/>
          <div class="form-grid" style="margin-bottom:12px">
            <div class="form-group">
              <label>Nom</label>
              <input type="text" id="juryNom" name="nom" placeholder="Nom" required/>
            </div>
            <div class="form-group">
              <label>Prénom</label>
              <input type="text" id="juryPrenom" name="prenom" placeholder="Prénom" required/>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label>Email</label>
            <input type="email" id="juryEmail" name="email" placeholder="Email" required/>
          </div>
          <div class="form-group">
            <label>Type</label>
            <input type="text" id="juryType" name="type" placeholder="Ex: Président, Rapporteur…" required/>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="document.getElementById('juryForm').submit()">
          <i class="fas fa-check"></i> Enregistrer
        </button>
      </div>
    </div>
  </div>

  <script>
    var createUrl = /*[[@{/jury/create}]]*/ '/jury/create';

    function filterTable() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('#tableBody tr').forEach(function(r) {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    }
    function openAdd() {
      document.getElementById('modalTitle').textContent = 'Ajouter un jury';
      document.getElementById('juryForm').action = createUrl;
      ['juryId','juryNom','juryPrenom','juryEmail','juryType'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
      document.getElementById('juryModal').classList.add('open');
    }
    function openEdit(btn) {
      document.getElementById('modalTitle').textContent  = 'Modifier le jury';
      document.getElementById('juryForm').action         = btn.dataset.url;
      document.getElementById('juryId').value            = btn.dataset.id;
      document.getElementById('juryNom').value           = btn.dataset.nom;
      document.getElementById('juryPrenom').value        = btn.dataset.prenom;
      document.getElementById('juryEmail').value         = btn.dataset.email   || '';
      document.getElementById('juryType').value          = btn.dataset.type    || '';
      document.getElementById('juryModal').classList.add('open');
    }
    function closeModal()           { document.getElementById('juryModal').classList.remove('open'); }
    function closeOnBackdrop(e)     { if (e.target === e.currentTarget) closeModal(); }
  </script>

</section>
</body>
</html>
