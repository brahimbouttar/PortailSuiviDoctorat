<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          'Tableau de bord',
          'Vue d\'ensemble de l\'activité du portail doctoral',
          'dashboard'
      )}">
<head><title>Tableau de bord</title></head>
<body>

<section th:fragment="content">

  <!-- KPI CARDS -->
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-icon blue"><i class="fas fa-users"></i></div>
      <div>
        <div class="kpi-val" th:text="${totalUsers}">248</div>
        <div class="kpi-lbl">Utilisateurs</div>
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-icon green"><i class="fas fa-user-graduate"></i></div>
      <div>
        <div class="kpi-val" th:text="${totalDoctorants}">184</div>
        <div class="kpi-lbl">Doctorants</div>
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-icon amber"><i class="fas fa-hourglass-half"></i></div>
      <div>
        <div class="kpi-val" th:text="${demandesEnAttente}">12</div>
        <div class="kpi-lbl">Demandes à traiter</div>
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-icon teal"><i class="fas fa-circle-check"></i></div>
      <div>
        <div class="kpi-val" th:text="${demandesAutorisees}">37</div>
        <div class="kpi-lbl">Soutenances autorisées</div>
      </div>
    </div>
  </div>

  <!-- PENDING REQUESTS TABLE -->
  <div class="card">
    <div class="card-head">
      <h6><i class="fas fa-bell"></i> Demandes en attente de validation</h6>
      <a th:href="@{/admin/demandes}" class="link-btn">
        <i class="fas fa-arrow-right"></i> Gérer tout
      </a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(derniersDemandes)}">
      <i class="fas fa-check-double"></i>
      Aucune demande en attente — tout est à jour !
    </div>

    <table th:unless="${#lists.isEmpty(derniersDemandes)}">
      <thead>
      <tr>
        <th>Doctorant</th>
        <th>Date de dépôt</th>
        <th>Articles Q1/Q2</th>
        <th>Statut</th>
        <th style="text-align:center">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="d : ${derniersDemandes}">
        <td>
            <span th:if="${d.doctorant != null}"
                  th:text="${d.doctorant.prenom + ' ' + d.doctorant.nom}">—</span>
          <span th:unless="${d.doctorant != null}" style="color:var(--muted)">—</span>
        </td>
        <td th:text="${d.dateDepot != null ? #temporals.format(d.dateDepot,'dd/MM/yyyy') : '—'}">—</td>
        <td th:text="${d.nbrArticlesQ1Q2 != null ? d.nbrArticlesQ1Q2 : '—'}">—</td>
        <td>
          <span class="badge badge-info" th:text="${d.statut}">En attente</span>
        </td>
        <td>
          <div class="act">
            <form th:action="@{/admin/demandes/{id}/autoriser(id=${d.id})}"
                  method="post" style="display:inline">
              <button type="submit" class="act-btn ok" title="Autoriser">
                <i class="fas fa-check"></i>
              </button>
            </form>
            <form th:action="@{/admin/demandes/{id}/refuser(id=${d.id})}"
                  method="post" style="display:inline">
              <button type="submit" class="act-btn no" title="Refuser">
                <i class="fas fa-xmark"></i>
              </button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</section>
</body>
</html>
