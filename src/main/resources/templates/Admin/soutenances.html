<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          'Soutenances',
          'Gestion des soutenances de doctorat',
          'soutenances'
      )}">
<head><title>Soutenances</title></head>
<body>

<section th:fragment="content">
<style>
  /* ── SEARCH ──────────────────────────────────────────────── */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .search-wrap { flex: 1; max-width: 300px; position: relative; }
  .search-wrap i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .78rem; pointer-events: none; }
  .search-wrap input {
    width: 100%; padding: 8px 12px 8px 32px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: .81rem; color: var(--text); background: var(--surface);
    font-family: inherit; transition: border-color .12s;
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,110,244,.1); }
  .count-label { font-size: .72rem; color: var(--muted); margin-left: auto; }

  /* ── BTNS ────────────────────────────────────────────────── */
  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    padding: 7px 14px; border-radius: 6px; font-size: .78rem; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .13s;
  }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 5px 11px; border-radius: 6px; font-size: .75rem; font-weight: 500;
    cursor: pointer; transition: all .13s;
  }
  .btn-ghost:hover { border-color: #c7d9fd; color: var(--accent); background: #eff6ff; }

  /* ── DATE BADGE ──────────────────────────────────────────── */
  .date-badge {
    display: inline-block; background: #eff6ff; color: var(--accent);
    border: 1px solid #c7d9fd; font-size: .68rem; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ── NOTE CIRCLE ─────────────────────────────────────────── */
  .note-circle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    font-weight: 700; font-size: .78rem; flex-shrink: 0;
  }
  .note-circle.high { background: #d1fae5; color: #065f46; }
  .note-circle.mid  { background: #fef9c3; color: #713f12; }
  .note-circle.low  { background: #fef2f2; color: #991b1b; }
  .note-mention { font-size: .68rem; color: var(--muted); margin-left: 5px; }

  /* ── MODAL ───────────────────────────────────────────────── */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,20,35,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 10px; width: 100%; max-width: 520px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.18); animation: modalIn .18s ease; }
  @keyframes modalIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { padding: 15px 20px; background: var(--navy); border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 9px; color: #fff; flex-shrink: 0; }
  .modal-head h5 { font-size: .88rem; font-weight: 600; margin: 0; flex: 1; }
  .modal-head .close-btn { background: none; border: none; color: rgba(255,255,255,.45); font-size: .85rem; cursor: pointer; padding: 2px 5px; transition: color .12s; }
  .modal-head .close-btn:hover { color: #fff; }
  .modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
  .modal-foot { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg); border-radius: 0 0 10px 10px; flex-shrink: 0; }

  /* ── FORM ────────────────────────────────────────────────── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: .71rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .form-group label .req { color: var(--danger); }
  .form-group input {
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
    font-size: .81rem; color: var(--text); background: var(--surface);
    font-family: inherit; transition: border-color .12s;
  }
  .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,110,244,.1); }
  .input-suffix { display: flex; }
  .input-suffix input { border-radius: 6px 0 0 6px; flex: 1; }
  .input-suffix span { border: 1px solid var(--border); border-left: none; border-radius: 0 6px 6px 0; padding: 7px 10px; font-size: .78rem; color: var(--muted); background: var(--bg); }
  .form-hint { font-size: .67rem; color: var(--muted); margin-top: 2px; }
</style>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input id="searchInput" placeholder="Rechercher par lieu…" oninput="filterTable()"/>
    </div>
    <span class="count-label" id="countLabel"></span>
    <button class="btn-primary" onclick="openModal(null)" style="margin-left:auto">
      <i class="fas fa-plus"></i> Nouvelle soutenance
    </button>
  </div>

  <!-- TABLE CARD -->
  <div class="card">
    <div class="card-head">
      <h6><i class="fas fa-table"></i> Liste des soutenances</h6>
      <span style="font-size:.68rem;color:var(--muted);font-weight:600"
            th:text="${#lists.size(soutenances)} + ' enregistrement(s)'">0</span>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:44px">#</th>
          <th>Date</th>
          <th>Lieu</th>
          <th>Note</th>
          <th>Publications</th>
          <th style="text-align:center;width:100px">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">

        <!-- EMPTY STATE -->
        <tr th:if="${#lists.isEmpty(soutenances)}">
          <td colspan="6" style="text-align:center;padding:48px 20px;color:var(--muted);font-size:.8rem">
            <i class="fas fa-inbox" style="font-size:2rem;color:#d1d5db;display:block;margin-bottom:10px"></i>
            <p style="margin-bottom:12px">Aucune soutenance enregistrée.</p>
            <button class="btn-primary" onclick="openModal(null)">
              <i class="fas fa-plus"></i> Ajouter la première
            </button>
          </td>
        </tr>

        <!-- NO SEARCH RESULTS -->
        <tr id="noResults" style="display:none">
          <td colspan="6" style="text-align:center;padding:36px 20px;color:var(--muted);font-size:.8rem">
            <i class="fas fa-search" style="font-size:1.6rem;color:#d1d5db;display:block;margin-bottom:8px"></i>
            Aucun résultat pour cette recherche.
          </td>
        </tr>

        <tr th:unless="${#lists.isEmpty(soutenances)}"
            th:each="s, stat : ${soutenances}"
            class="data-row"
            th:data-id="${s.id}"
            th:data-date="${s.date}"
            th:data-lieu="${s.lieu}"
            th:data-note="${s.note}"
            th:data-pub="${s.nbrPublication}">

          <td style="color:var(--muted);font-weight:600;font-size:.78rem" th:text="${stat.count}"></td>

          <td>
            <span class="date-badge"
                  th:text="${s.date != null ? #temporals.format(s.date,'dd/MM/yyyy') : '—'}">—</span>
          </td>

          <td class="lieu-cell" style="font-weight:600"
              th:text="${s.lieu != null ? s.lieu : '—'}">—</td>

          <td>
            <span th:if="${s.note != null}" style="display:inline-flex;align-items:center">
              <span class="note-circle"
                    th:class="${s.note >= 16} ? 'note-circle high' : (${s.note >= 12} ? 'note-circle mid' : 'note-circle low')"
                    th:text="${s.note}"></span>
              <span class="note-mention"
                    th:text="${s.note >= 16} ? 'Très bien' : (${s.note >= 12} ? 'Bien' : 'Passable')"></span>
            </span>
            <span th:unless="${s.note != null}" style="color:var(--muted)">—</span>
          </td>

          <td>
            <span th:if="${s.nbrPublication != null}"
                  style="display:inline-flex;align-items:center;gap:5px">
              <i class="fas fa-newspaper" style="color:var(--accent);font-size:.75rem"></i>
              <strong th:text="${s.nbrPublication}"></strong>
            </span>
            <span th:unless="${s.nbrPublication != null}" style="color:var(--muted)">—</span>
          </td>

          <td>
            <div class="act">
              <button class="act-btn ok" title="Modifier"
                      th:onclick="'openModal(' + ${s.id} + ', this)'">
                <i class="fas fa-pencil"></i>
              </button>
              <form th:action="@{/soutenances/delete(id=${s.id})}" method="post" style="display:inline"
                    onsubmit="return confirm('Supprimer cette soutenance ?')">
                <button type="submit" class="act-btn no" title="Supprimer">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- ═══ MODAL ═══════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="soutenanceModal" onclick="closeOnBackdrop(event)">
    <div class="modal-box">
      <div class="modal-head">
        <i class="fas fa-pencil-square" style="font-size:.82rem"></i>
        <h5 id="modalTitleText">Nouvelle soutenance</h5>
        <button class="close-btn" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form id="soutenanceForm" action="/soutenances/save" method="post">
          <input type="hidden" id="formId" name="id"/>
          <div class="form-grid">
            <div class="form-group">
              <label>Date <span class="req">*</span></label>
              <input type="date" id="formDate" name="date" required/>
            </div>
            <div class="form-group">
              <label>Lieu <span class="req">*</span></label>
              <input type="text" id="formLieu" name="lieu" placeholder="Ex : Amphi A…" required maxlength="200"/>
            </div>
            <div class="form-group">
              <label>Note (sur 20)</label>
              <div class="input-suffix">
                <input type="number" id="formNote" name="note" placeholder="0 – 20" min="0" max="20" step="0.25"/>
                <span>/20</span>
              </div>
            </div>
            <div class="form-group">
              <label>Publications</label>
              <input type="number" id="formPub" name="nbrPublication" placeholder="0" min="0"/>
              <span class="form-hint">Facultatif</span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeModal()">Annuler</button>
        <button class="btn-primary" onclick="submitForm()">
          <i class="fas fa-floppy-disk"></i>
          <span id="submitLabel">Créer</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function filterTable() {
      const q    = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody .data-row');
      let count  = 0;
      rows.forEach(r => {
        const show = (r.querySelector('.lieu-cell')?.textContent.toLowerCase() || '').includes(q);
        r.style.display = show ? '' : 'none';
        if (show) count++;
      });
      document.getElementById('noResults').style.display =
        (count === 0 && rows.length > 0) ? '' : 'none';
      document.getElementById('countLabel').textContent =
        rows.length > 0 ? count + ' / ' + rows.length + ' résultat(s)' : '';
    }
    window.addEventListener('DOMContentLoaded', filterTable);

    function openModal(id, btn) {
      const form = document.getElementById('soutenanceForm');
      if (id && btn) {
        const row = btn.closest('tr');
        document.getElementById('formId').value   = id;
        document.getElementById('formDate').value = row.dataset.date || '';
        document.getElementById('formLieu').value = row.dataset.lieu || '';
        document.getElementById('formNote').value = row.dataset.note || '';
        document.getElementById('formPub').value  = row.dataset.pub  || '';
        document.getElementById('modalTitleText').textContent = 'Modifier la soutenance';
        document.getElementById('submitLabel').textContent    = 'Enregistrer';
        form.action = '/soutenances/update';
      } else {
        ['formId','formDate','formLieu','formNote','formPub']
          .forEach(i => document.getElementById(i).value = '');
        document.getElementById('modalTitleText').textContent = 'Nouvelle soutenance';
        document.getElementById('submitLabel').textContent    = 'Créer';
        form.action = '/soutenances/save';
      }
      document.getElementById('soutenanceModal').classList.add('open');
    }
    function closeModal()         { document.getElementById('soutenanceModal').classList.remove('open'); }
    function closeOnBackdrop(e)   { if (e.target === e.currentTarget) closeModal(); }
    function submitForm() {
      const form = document.getElementById('soutenanceForm');
      if (form.checkValidity()) { form.submit(); }
      else { form.reportValidity(); }
    }
  </script>

</section>
</body>
</html>
