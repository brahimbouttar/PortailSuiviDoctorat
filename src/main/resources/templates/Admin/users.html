<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{fragments/admin-layout :: layout('Gestion des utilisateurs', 'Modification des rôles et suivi des comptes', 'users', ~{::section})}">
<body>
<section>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <div class="card">
    <div class="card-body p-3">
      <div th:if="${#lists.isEmpty(users)}" class="text-center py-4">
        <i class="bi bi-people text-muted" style="font-size:2rem;"></i>
        <p class="text-muted mt-2 mb-0">Aucun utilisateur trouvé.</p>
      </div>

      <div class="table-responsive" th:unless="${#lists.isEmpty(users)}">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Rôle</th>
            <th class="text-end">Modifier le rôle</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.prenom + ' ' + u.nom}">-</td>
            <td th:text="${u.email}">-</td>
            <td th:text="${u.telephone}">-</td>
            <td><span class="badge bg-secondary" th:text="${u.role}">-</span></td>
            <td>
              <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"
                    class="d-flex justify-content-end gap-2">
                <select name="role" class="form-select form-select-sm" style="max-width:180px;">
                  <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                  <option value="DOCTORANT" th:selected="${u.role == 'DOCTORANT'}">DOCTORANT</option>
                  <option value="ENCADRANT" th:selected="${u.role == 'ENCADRANT'}">ENCADRANT</option>
                  <option value="JURY" th:selected="${u.role == 'JURY'}">JURY</option>
                </select>
                <button type="submit" class="btn btn-sm btn-primary">
                  <i class="bi bi-save me-1"></i>Enregistrer
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
</body>
</html>
