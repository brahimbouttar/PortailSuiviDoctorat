<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          'Gestion des doctorants',
          'Suivi des profils doctorants',
          'doctorants'
      )}">
<head><title>Doctorants</title></head>
<body>

<section th:fragment="content">
  <style>
    .alert {
      padding: 10px 14px; border-radius: 7px; font-size: .8rem;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px; border: 1px solid transparent;
    }
    .alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .alert-danger  { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

    .assign-form {
      display: inline-flex; gap: 6px; align-items: center;
    }
    .assign-form select {
      border: 1px solid var(--border); border-radius: 5px;
      padding: 5px 8px; font-size: .75rem; color: var(--text);
      background: var(--surface); max-width: 170px;
      font-family: inherit; cursor: pointer;
    }
    .assign-form select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,110,244,.1);
    }
    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--muted); font-size: .8rem;
    }
    .empty-state i { font-size: 2rem; color: #d1d5db; display: block; margin-bottom: 10px; }
  </style>

  <div class="alert alert-success" th:if="${successMessage}">
    <i class="fas fa-check-circle"></i><span th:text="${successMessage}"></span>
  </div>
  <div class="alert alert-danger" th:if="${errorMessage}">
    <i class="fas fa-exclamation-circle"></i><span th:text="${errorMessage}"></span>
  </div>

  <div class="card">
    <div class="card-head">
      <h6><i class="fas fa-user-graduate"></i> Liste des doctorants</h6>
    </div>

    <div th:if="${#lists.isEmpty(doctorants)}" class="empty-state">
      <i class="fas fa-mortarboard"></i>
      <p>Aucun doctorant trouvé.</p>
    </div>

    <table th:unless="${#lists.isEmpty(doctorants)}">
      <thead>
        <tr>
          <th>Nom</th><th>Email</th><th>Sujet de thèse</th>
          <th>Encadrant</th><th style="text-align:center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="d : ${doctorants}">
          <td style="font-weight:600" th:text="${d.prenom + ' ' + d.nom}">-</td>
          <td th:text="${d.email}">-</td>
          <td th:text="${d.sujetThese != null ? d.sujetThese : '-'}">-</td>
          <td>
            <span th:if="${d.encadrant != null}" th:text="${d.encadrant.prenom + ' ' + d.encadrant.nom}">-</span>
            <span th:unless="${d.encadrant != null}" style="color:var(--muted)">Non assigné</span>
          </td>
          <td>
            <div class="act">
              <form class="assign-form" th:action="@{/admin/doctorants/{id}/encadrant(id=${d.id})}" method="post">
                <select name="encadrantId" required>
                  <option value="0" th:selected="${d.encadrant == null}">Non assigné</option>
                  <option th:each="e : ${encadrants}"
                          th:value="${e.id}"
                          th:selected="${d.encadrant != null and d.encadrant.id == e.id}"
                          th:text="${e.prenom + ' ' + e.nom}">Encadrant</option>
                </select>
                <button type="submit" class="act-btn ok" title="Assigner">
                  <i class="fas fa-user-check"></i>
                </button>
              </form>
              <form th:action="@{/admin/doctorants/{id}/delete(id=${d.id})}" method="post" style="display:inline"
                    onsubmit="return confirm('Supprimer ce doctorant ?')">
                <button type="submit" class="act-btn no" title="Supprimer">
                  <i class="fas fa-trash"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
