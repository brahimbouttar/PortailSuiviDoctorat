<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Doctorants</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { background:#f5f6fa; }
    .card { border-radius:10px; }
    .table th { font-size:0.8rem; text-transform:uppercase; }
  </style>
</head>
<body>

<div class="container mt-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Doctorants</h4>
    <a th:href="@{/doctorants/form}" class="btn btn-primary btn-sm">
      <i class="fas fa-plus"></i> Ajouter
    </a>
  </div>

  <!-- Search -->
  <div class="mb-3">
    <input id="searchInput" class="form-control" placeholder="Rechercher..." oninput="filterTable()"/>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Sujet</th>
          <th class="text-center">Actions</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr th:each="d, stat : ${doctorants}">
          <td th:text="${stat.count}"></td>
          <td th:text="${d.prenom + ' ' + d.nom}"></td>
          <td th:text="${d.email != null ? d.email : '-'}"></td>
          <td th:text="${d.telephone != null ? d.telephone : '-'}"></td>
          <td th:text="${d.sujetThese != null ? d.sujetThese : '-'}"></td>
          <td class="text-center">
            <a th:href="@{/doctorants/detail(id=${d.id})}" class="btn btn-sm btn-info">
              <i class="fas fa-eye"></i>
            </a>
            <a th:href="@{/doctorants/form(id=${d.id})}" class="btn btn-sm btn-primary">
              <i class="fas fa-edit"></i>
            </a>
            <!-- Formulaire POST vers /doctorants/delete?id=... -->
            <form th:action="@{/doctorants/delete(id=${d.id})}" method="post"
                  class="d-inline"
                  onsubmit="return confirm('Supprimer ce doctorant ?')">
              <button type="submit" class="btn btn-sm btn-danger">
                <i class="fas fa-trash"></i>
              </button>
            </form>
          </td>
        </tr>

        <!-- Empty state -->
        <tr th:if="${#lists.isEmpty(doctorants)}">
          <td colspan="6" class="text-center text-muted py-4">
            Aucun doctorant trouvé.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tableBody tr');
    rows.forEach(row => {
      row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
    });
  }
</script>

</body>
</html>
