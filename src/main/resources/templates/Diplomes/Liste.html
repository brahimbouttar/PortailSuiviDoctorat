<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestion Diplômes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body{
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar-container{
            width: 250px;
            min-height: 100vh;
            background: #212529;
        }

        /* Content */
        .content-container{
            flex: 1;
            padding: 20px;
        }
    </style>
</head>

<body class="bg-light">

<div class="d-flex">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content-container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestion des Diplômes</h2>

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addModal">
                Ajouter
            </button>
        </div>

        <table class="table table-bordered table-striped bg-white shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Bac</th>
                <th>Licence</th>
                <th>Master</th>
                <th>Fichiers</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="d : ${diplomes}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.bac}"></td>
                <td th:text="${d.licence}"></td>
                <td th:text="${d.master}"></td>

                <td>
                    <a th:if="${d.bacFile != null}"
                       th:href="@{'/uploads/' + ${d.bacFile}}"
                       target="_blank">
                        Bac
                    </a>

                    |

                    <a th:if="${d.licenceFile != null}"
                       th:href="@{'/uploads/' + ${d.licenceFile}}"
                       target="_blank">
                        Licence
                    </a>

                    |

                    <a th:if="${d.masterFile != null}"
                       th:href="@{'/uploads/' + ${d.masterFile}}"
                       target="_blank">
                        Master
                    </a>
                </td>

                <td>
                    <a th:href="@{/Diplome/delete/{id}(id=${d.id})}"
                       class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div class="modal fade" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/Diplome/create}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="modal-header">
                    <h5 class="modal-title">Ajouter Diplôme</h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <input type="text"
                           name="bac"
                           class="form-control mb-2"
                           placeholder="Bac">

                    <input type="file"
                           name="bacFile"
                           class="form-control mb-2">

                    <input type="text"
                           name="licence"
                           class="form-control mb-2"
                           placeholder="Licence">

                    <input type="file"
                           name="licenceFile"
                           class="form-control mb-2">

                    <input type="text"
                           name="master"
                           class="form-control mb-2"
                           placeholder="Master">

                    <input type="file"
                           name="masterFile"
                           class="form-control mb-2">

                </div>

                <div class="modal-footer">
                    <button class="btn btn-success">
                        Save
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
