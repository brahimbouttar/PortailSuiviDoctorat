<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Diplômes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="mb-3">
        <h4 class="fw-bold mb-0">Diplômes</h4>
        <small class="text-muted">Liste des diplômes enregistrés</small>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-3">
            <div th:if="${#lists.isEmpty(diplomes)}" class="text-center text-muted py-4">
                Aucun diplôme trouvé.
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(diplomes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Bac</th>
                        <th>Licence</th>
                        <th>Master</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d, stat : ${diplomes}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${d.bac != null ? d.bac : '-'}">-</td>
                        <td th:text="${d.licence != null ? d.licence : '-'}">-</td>
                        <td th:text="${d.master != null ? d.master : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
