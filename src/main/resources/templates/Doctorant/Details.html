<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/doctorant-layout :: layout(
          'Mon profil',
          'Informations personnelles et suivi du dossier',
          'profil'
      )}">
<head><title>Mon profil</title></head>
<body>

<section th:fragment="section">
  <style>
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .detail-item { }
    .detail-item label {
      font-size: .68rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 3px;
    }
    .detail-item span {
      font-size: .88rem; color: var(--text); font-weight: 500;
    }
    .detail-item span.missing { color: var(--muted); font-weight: 400; font-style: italic; }
    .full-width { grid-column: 1 / -1; }

    .section-title {
      font-size: .75rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .encadrant-box {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: #f5f3ff; border: 1px solid #ddd6fe;
      border-radius: 8px; margin-bottom: 16px;
    }
    .encadrant-box i { color: var(--accent); font-size: 1.2rem; }
    .encadrant-box p { font-size: .82rem; font-weight: 600; }
    .encadrant-box small { font-size: .7rem; color: var(--muted); }
    .encadrant-box .missing { color: var(--muted); font-weight: 400; font-style: italic; }
  </style>

  <div th:if="${doctorant == null}" style="text-align:center;padding:48px 20px;color:var(--muted)">
    <i class="fas fa-circle-user" style="font-size:2.5rem;color:#d1d5db;display:block;margin-bottom:12px"></i>
    <p>Aucun profil doctorant trouvé.</p>
    <a th:href="@{/doctorants}" class="btn-primary" style="display:inline-flex;text-decoration:none">
      <i class="fas fa-arrow-left"></i> Retour
    </a>
  </div>

  <div th:if="${doctorant != null}">

    <!-- Encadrant info -->
    <div class="encadrant-box" th:if="${doctorant.encadrant != null}">
      <i class="fas fa-chalkboard-user"></i>
      <div>
        <p>Encadré par <span th:text="${doctorant.encadrant.prenom + ' ' + doctorant.encadrant.nom}">-</span></p>
        <small th:text="${doctorant.encadrant.email}">email</small>
      </div>
    </div>
    <div class="encadrant-box" th:unless="${doctorant.encadrant != null}">
      <i class="fas fa-user-plus"></i>
      <div><p class="missing">Aucun encadrant assigné</p></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h6><i class="fas fa-address-card"></i> Informations personnelles</h6>
        <a th:href="@{/doctorants/form(id=${doctorant.id})}" class="link-to">
          <i class="fas fa-pencil"></i> Modifier
        </a>
      </div>
      <div style="padding:18px 20px">
        <div class="detail-grid">
          <div class="detail-item">
            <label>Nom</label>
            <span th:text="${doctorant.nom != null ? doctorant.nom : '-'}" th:classappend="${doctorant.nom == null} ? 'missing'">-</span>
          </div>
          <div class="detail-item">
            <label>Prénom</label>
            <span th:text="${doctorant.prenom != null ? doctorant.prenom : '-'}" th:classappend="${doctorant.prenom == null} ? 'missing'">-</span>
          </div>
          <div class="detail-item">
            <label>Email</label>
            <span th:text="${doctorant.email != null ? doctorant.email : '-'}" th:classappend="${doctorant.email == null} ? 'missing'">-</span>
          </div>
          <div class="detail-item">
            <label>Téléphone</label>
            <span th:text="${doctorant.telephone != null ? doctorant.telephone : '-'}" th:classappend="${doctorant.telephone == null} ? 'missing'">-</span>
          </div>
          <div class="detail-item full-width">
            <label>Adresse</label>
            <span th:text="${doctorant.adresse != null ? doctorant.adresse : '-'}" th:classappend="${doctorant.adresse == null} ? 'missing'">-</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <h6><i class="fas fa-graduation-cap"></i> Sujet de thèse</h6>
      </div>
      <div style="padding:14px 20px">
        <p style="font-size:.88rem;color:var(--text);line-height:1.6"
           th:text="${doctorant.sujetThese != null and !doctorant.sujetThese.isBlank() ? doctorant.sujetThese : 'Non renseigné'}"
           th:classappend="${doctorant.sujetThese == null or doctorant.sujetThese.isBlank()} ? 'missing'">
          Non renseigné
        </p>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <h6><i class="fas fa-folder-open"></i> Documents</h6>
      </div>
      <div style="padding:14px 20px">
        <div class="detail-grid">
          <div class="detail-item">
            <label>CV</label>
            <a th:if="${doctorant.CV != null and !doctorant.CV.isBlank()}"
               class="file-link" style="display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--accent);text-decoration:none;padding:3px 9px;border:1px solid #ddd6fe;border-radius:5px;background:#f5f3ff"
               th:href="@{'/uploads/' + ${doctorant.CV}}" target="_blank">
              <i class="fas fa-file-pdf"></i> Télécharger
            </a>
            <span th:unless="${doctorant.CV != null and !doctorant.CV.isBlank()}" class="missing">Non renseigné</span>
          </div>
          <div class="detail-item">
            <label>Lettre de motivation</label>
            <a th:if="${doctorant.lettreMotivation != null and !doctorant.lettreMotivation.isBlank()}"
               class="file-link" style="display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--accent);text-decoration:none;padding:3px 9px;border:1px solid #ddd6fe;border-radius:5px;background:#f5f3ff"
               th:href="@{'/uploads/' + ${doctorant.lettreMotivation}}" target="_blank">
              <i class="fas fa-file-pdf"></i> Télécharger
            </a>
            <span th:unless="${doctorant.lettreMotivation != null and !doctorant.lettreMotivation.isBlank()}" class="missing">Non renseignée</span>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:16px;display:flex;gap:8px">
      <a th:href="@{/doctorants/form(id=${doctorant.id})}" class="btn-primary" style="text-decoration:none">
        <i class="fas fa-pencil"></i> Modifier mon profil
      </a>
      <a th:href="@{/doctorants}" style="color:var(--muted);font-size:.78rem;padding:7px 14px;border:1px solid var(--border);border-radius:6px;text-decoration:none;display:inline-flex;align-items:center;gap:6px">
        <i class="fas fa-arrow-left"></i> Tableau de bord
      </a>
    </div>

  </div>
</section>
</body>
</html>
