<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tableau de bord – Portail Doctorat</title>
  <!-- Bootstrap 5 CDN uniquement -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<div class="d-flex min-vh-100">

  <!-- ===== SIDEBAR ===== -->
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <div class="flex-grow-1 d-flex flex-column">

    <!-- PAGE BODY -->
    <div class="p-4 d-flex flex-column gap-4 flex-grow-1">

      <!-- ===== ALERTE URGENTE ===== -->
      <div class="alert alert-warning d-flex align-items-start gap-2 border-0 shadow-sm mb-0"
           th:if="${alerteUrgente != null}" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
             class="flex-shrink-0 mt-1" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        <div th:utext="${alerteUrgente}">
          Votre <strong>réinscription 3ème année</strong> est à soumettre avant le
          <strong>15 oct. 2025</strong>. <a href="#" class="alert-link">Compléter le dossier →</a>
        </div>
      </div>

      <!-- ===== CARTES STATISTIQUES ===== -->
      <div class="row g-3">

        <!-- Année de doctorat -->
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="rounded-3 p-3 flex-shrink-0"
                   style="background:#EEEDFE;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     fill="#534AB7" viewBox="0 0 16 16">
                  <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0 2 0V6a.5.5 0 0 0-.309-.462l-7.5-3.5z"/>
                  <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.5 4.176 9.032z"/>
                </svg>
              </div>
              <div>
                <p class="text-muted small mb-1">Année de doctorat</p>
<!--                <h5 class="fw-bold mb-0"-->
<!--                    th:text="${doctorant.anneeDoctorat + 'ème'}">3ème</h5>-->
<!--                <small class="text-muted"-->
<!--                       th:text="'Depuis ' + ${#temporals.format(doctorant.dateInscription,'MMM yyyy')}">-->
<!--                  Depuis oct. 2022</small>-->
              </div>
            </div>
          </div>
        </div>

        <!-- Avancement -->
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="rounded-3 p-3 flex-shrink-0"
                   style="background:#EAF3DE;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     fill="#3B6D11" viewBox="0 0 16 16">
                  <path d="M0 0h1v15h15v1H0V0Zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5Z"/>
                </svg>
              </div>
              <div>
                <p class="text-muted small mb-1">Avancement</p>
<!--                <h5 class="fw-bold mb-0"-->
<!--                    th:text="${doctorant.avancement + '%'}">68%</h5>-->
                <small class="text-success">En cours</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Dossiers soumis -->
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="rounded-3 p-3 flex-shrink-0"
                   style="background:#FAEEDA;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     fill="#854F0B" viewBox="0 0 16 16">
                  <path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2L9.5 1.5z"/>
                </svg>
              </div>
              <div>
                <p class="text-muted small mb-1">Dossiers soumis</p>
<!--                <h5 class="fw-bold mb-0"-->
<!--                    th:text="${stats.dossiersTotal}">4</h5>-->
<!--                <small class="text-warning fw-semibold"-->
<!--                       th:text="${stats.dossiersEnAttente + ' en attente'}">1 en attente</small>-->
              </div>
            </div>
          </div>
        </div>

        <!-- Soutenance -->
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center gap-3">
              <div class="rounded-3 p-3 flex-shrink-0"
                   style="background:#E6F1FB;">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                     fill="#185FA5" viewBox="0 0 16 16">
                  <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM2 2a1 1 0 0 0-1 1v1h14V3a1 1 0 0 0-1-1H2zm13 3H1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5z"/>
                </svg>
              </div>
              <div>
                <p class="text-muted small mb-1">Soutenance prévue</p>
<!--                <h5 class="fw-bold mb-0"-->
<!--                    th:text="${#temporals.format(doctorant.dateSoutenance,'MMM yy')}">Juin 26</h5>-->
<!--                <small class="text-muted"-->
<!--                       th:text="${stats.moisRestants + ' mois restants'}">~8 mois</small>-->
              </div>
            </div>
          </div>
        </div>

      </div><!-- /stats row -->

      <!-- ===== GRILLE BAS ===== -->
      <div class="row g-3">

        <!-- COLONNE GAUCHE -->
        <div class="col-12 col-lg-8 d-flex flex-column gap-3">

          <!-- Suivi des dossiers -->
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
              <h6 class="mb-0 fw-semibold">Suivi des dossiers</h6>
              <a th:href="@{/dossiers}" class="btn btn-sm btn-outline-primary">Voir tout</a>
            </div>
            <div class="card-body p-0">

              <!-- Ligne par dossier -->
              <div th:each="dossier, stat : ${dossiers}"
                   class="d-flex align-items-center gap-3 px-4 py-3 border-bottom">

                <!-- Numéro étape -->
<!--                <div class="rounded-circle d-flex align-items-center justify-content-center-->
<!--                            fw-semibold flex-shrink-0"-->
<!--                     style="width:30px;height:30px;font-size:12px;"-->
<!--                     th:classappend="${dossier.statut.name() == 'VALIDE'} ? 'bg-success bg-opacity-10 text-success'-->
<!--                                   : (${dossier.statut.name() == 'EN_ATTENTE'} ? 'bg-warning bg-opacity-25 text-warning'-->
<!--                                   : 'bg-secondary bg-opacity-10 text-secondary')"-->
<!--                     th:text="${stat.index + 1}">1</div>-->

                <!-- Titre + description -->
                <div class="flex-grow-1">
<!--                  <p class="mb-0 fw-semibold small" th:text="${dossier.titre}">Inscription 1ère année</p>-->
<!--                  <p class="mb-0 text-muted" style="font-size:11px;"-->
<!--                     th:text="${dossier.description}">Validé le 05/10/2022</p>-->
                </div>

                <!-- Badge statut -->
<!--                <span class="badge rounded-pill fw-normal"-->
<!--                      th:classappend="${dossier.statut.name() == 'VALIDE'} ? 'bg-success'-->
<!--                                    : (${dossier.statut.name() == 'EN_ATTENTE'} ? 'bg-warning text-dark'-->
<!--                                    : (${dossier.statut.name() == 'REJETE'} ? 'bg-danger'-->
<!--                                    : 'bg-secondary'))"-->
<!--                      th:text="${dossier.statutLibelle}">Validé</span>-->
              </div>

<!--              <p class="text-muted text-center small py-3 mb-0 fst-italic"-->
<!--                 th:if="${#lists.isEmpty(dossiers)}">Aucun dossier trouvé.</p>-->
            </div>
          </div>

          <!-- Manuscrit de thèse -->
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
              <h6 class="mb-0 fw-semibold">Manuscrit de thèse</h6>
<!--              <a th:href="@{/manuscrit/depot}" class="btn btn-sm btn-outline-primary">Déposer</a>-->
            </div>

            <!-- Aucun manuscrit -->
            <div class="px-4 py-3" th:if="${manuscrit == null}">
              <p class="text-muted small fst-italic mb-2">Aucun manuscrit déposé.</p>
            </div>


          </div>

        </div><!-- /col-left -->

        <!-- COLONNE DROITE -->
        <div class="col-12 col-lg-4 d-flex flex-column gap-3">

          <!-- Échéances -->
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom py-3">
              <h6 class="mb-0 fw-semibold">Échéances à venir</h6>
            </div>
            <div class="card-body d-flex flex-column gap-3">

            </div>
          </div>


        </div><!-- /col-right -->
      </div><!-- /bottom row -->
    </div><!-- /page-body -->
  </div><!-- /main -->
</div><!-- /layout -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
