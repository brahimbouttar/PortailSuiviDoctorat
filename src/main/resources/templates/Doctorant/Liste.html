<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doctorants</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background:#f5f6fa; }
        .card { border-radius:10px; }
        .table th { font-size:0.8rem; text-transform:uppercase; }
        tr[onclick] { cursor: pointer; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Doctorants</h4>
        <button class="btn btn-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#addModal">
            <i class="fas fa-plus"></i> Ajouter
        </button>
    </div>

    <!-- Search (GET vers la même page avec paramètre q) -->
    <form th:action="@{/doctorants}" method="get" class="mb-3">
        <input name="q"
               th:value="${q}"
               class="form-control"
               placeholder="Rechercher...">
    </form>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Adresse</th>
                    <th>Téléphone</th>
                    <th>Sujet</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="d : ${doctorants}"
                    th:onclick="|window.location.href='@{/doctorants/detail(id=${d.id})}'|">

                    <td th:text="${d.nom}"></td>
                    <td th:text="${d.prenom}"></td>
                    <td th:text="${d.email != null ? d.email : '—'}"></td>
                    <td th:text="${d.adresse != null ? d.adresse : '—'}"></td>
                    <td th:text="${d.telephone != null ? d.telephone : '—'}"></td>
                    <td th:text="${d.sujetThese != null ? d.sujetThese : '—'}"></td>
                    <td class="text-center">

                        <!-- UPDATE : ouvre le modal pré-rempli via GET -->
                        <a th:href="@{/doctorants/edit(id=${d.id})}"
                           class="btn btn-primary btn-sm"
                           onclick="event.stopPropagation()">
                            <i class="fas fa-edit"></i>
                        </a>

                        <!-- DELETE : formulaire POST -->
                        <form th:action="@{/doctorants/delete/{id}(id=${d.id})}"
                              method="post"
                              style="display:inline;"
                              onclick="event.stopPropagation()"
                              onsubmit="return confirm('Supprimer ce doctorant ?')">
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>

                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(doctorants)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        Aucun doctorant trouvé.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>


<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Ajouter Doctorant</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/doctorants/save}" method="post" th:object="${newDoctorant}">
                <div class="modal-body">
                    <input th:field="*{nom}"        class="form-control mb-2" placeholder="Nom">
                    <input th:field="*{prenom}"     class="form-control mb-2" placeholder="Prénom">
                    <input th:field="*{email}"      class="form-control mb-2" placeholder="Email">
                    <input th:field="*{adresse}"    class="form-control mb-2" placeholder="Adresse">
                    <input th:field="*{telephone}"  class="form-control mb-2" placeholder="Téléphone">
                    <input th:field="*{sujetThese}" class="form-control mb-2" placeholder="Sujet">
                    <input th:field="*{password}"   class="form-control mb-2" placeholder="Mot de passe" type="password">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>
            </form>

        </div>
    </div>
</div>

<div class="modal fade" id="updateModal" tabindex="-1"
     th:if="${editDoctorant != null}">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Modifier Doctorant</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/doctorants/update/{id}(id=${editDoctorant.id})}"
                  method="post"
                  th:object="${editDoctorant}">
                <div class="modal-body">
                    <input th:field="*{nom}"        class="form-control mb-2" placeholder="Nom">
                    <input th:field="*{prenom}"     class="form-control mb-2" placeholder="Prénom">
                    <input th:field="*{email}"      class="form-control mb-2" placeholder="Email">
                    <input th:field="*{adresse}"    class="form-control mb-2" placeholder="Adresse">
                    <input th:field="*{telephone}"  class="form-control mb-2" placeholder="Téléphone">
                    <input th:field="*{sujetThese}" class="form-control mb-2" placeholder="Sujet">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-success">Mettre à jour</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:if="${editDoctorant != null}">
    new bootstrap.Modal(document.getElementById('updateModal')).show();
</script>

</body>
</html>
