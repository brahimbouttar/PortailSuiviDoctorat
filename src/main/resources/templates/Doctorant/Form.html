<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/doctorant-layout :: layout(
          'Modifier mon profil',
          'Mettez à jour vos informations personnelles',
          'profil'
      )}">
<head><title>Modifier mon profil</title></head>
<body>

<section th:fragment="section">
  <style>
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label {
      font-size: .71rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .form-group input, .form-group textarea {
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
      font-size: .81rem; color: var(--text); background: var(--surface);
      font-family: inherit; transition: border-color .12s;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,.1);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .full-width { grid-column: 1 / -1; }

    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 7px 14px; border-radius: 6px; font-size: .78rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .13s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 11px; border-radius: 6px; font-size: .75rem; font-weight: 500;
      cursor: pointer; transition: all .13s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-ghost:hover { border-color: #ddd6fe; color: var(--accent); background: #f5f3ff; }
  </style>

  <form th:action="@{/doctorants/save}" th:object="${doctorant}" method="post" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}"/>

    <div class="card">
      <div class="card-head">
        <h6><i class="fas fa-address-card"></i> Informations personnelles</h6>
      </div>
      <div style="padding:18px 20px">
        <div class="form-grid">
          <div class="form-group">
            <label>Nom</label>
            <input th:field="*{nom}" required/>
          </div>
          <div class="form-group">
            <label>Prénom</label>
            <input th:field="*{prenom}" required/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input th:field="*{email}" type="email" required/>
          </div>
          <div class="form-group">
            <label>Téléphone</label>
            <input th:field="*{telephone}"/>
          </div>
          <div class="form-group full-width">
            <label>Adresse</label>
            <input th:field="*{adresse}"/>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <h6><i class="fas fa-graduation-cap"></i> Thèse</h6>
      </div>
      <div style="padding:18px 20px">
        <div class="form-group full-width">
          <label>Sujet de thèse</label>
          <textarea th:field="*{sujetThese}" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <h6><i class="fas fa-folder-open"></i> Documents</h6>
      </div>
      <div style="padding:18px 20px">
        <div class="form-grid">
          <div class="form-group">
            <label>CV <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0" th:if="${doctorant.CV != null and !doctorant.CV.isBlank()}">(fichier actuel : <span th:text="${doctorant.CV}"></span>)</span></label>
            <input type="file" name="cvFile" accept=".pdf,.doc,.docx"/>
          </div>
          <div class="form-group">
            <label>Lettre de motivation <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0" th:if="${doctorant.lettreMotivation != null and !doctorant.lettreMotivation.isBlank()}">(fichier actuel : <span th:text="${doctorant.lettreMotivation}"></span>)</span></label>
            <input type="file" name="lettreFile" accept=".pdf,.doc,.docx"/>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head">
        <h6><i class="fas fa-lock"></i> Sécurité</h6>
      </div>
      <div style="padding:18px 20px">
        <div class="form-group" style="max-width:300px">
          <label>Mot de passe</label>
          <input th:field="*{password}" type="password" placeholder="Laisser vide pour conserver l'actuel"/>
        </div>
      </div>
    </div>

    <div style="margin-top:18px;display:flex;gap:8px">
      <button type="submit" class="btn-primary">
        <i class="fas fa-floppy-disk"></i> Enregistrer
      </button>
      <a th:href="@{/profil}" class="btn-ghost">
        <i class="fas fa-xmark"></i> Annuler
      </a>
    </div>
  </form>
</section>
</body>
</html>
