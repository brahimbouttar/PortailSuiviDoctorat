<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          ${utilisateur.id != 0 ? 'Modifier utilisateur' : 'Ajouter utilisateur'},
          'Informations du compte utilisateur',
          'users'
      )}">
<head><title>Utilisateur</title></head>
<body>

<section th:fragment="content">
    <style>
        .form-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 9px; overflow: hidden;
        }
        .form-card-body { padding: 24px; }
        .form-card-foot {
            padding: 13px 24px; border-top: 1px solid var(--border);
            background: var(--bg); display: flex;
            align-items: center; justify-content: space-between;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label {
            font-size: .71rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em;
        }
        .form-group input,
        .form-group select {
            border: 1px solid var(--border); border-radius: 6px;
            padding: 7px 10px; font-size: .81rem; color: var(--text);
            background: var(--surface); font-family: inherit;
            transition: border-color .12s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,110,244,.1);
        }

        .btn-primary {
            background: var(--accent); color: #fff; border: none;
            padding: 7px 16px; border-radius: 6px; font-size: .78rem; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            transition: opacity .13s;
        }
        .btn-primary:hover { opacity: .88; }
        .back-link {
            font-size: .75rem; color: var(--muted); text-decoration: none;
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface); transition: all .13s;
        }
        .back-link:hover { color: var(--accent); border-color: #c7d9fd; background: #eff6ff; }
    </style>

    <div class="form-card">
        <div class="form-card-body">
            <form th:action="@{/Utilisateur/save}" th:object="${utilisateur}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Nom</label>
                        <input th:field="*{nom}" placeholder="Nom" required/>
                    </div>
                    <div class="form-group">
                        <label>Prénom</label>
                        <input th:field="*{prenom}" placeholder="Prénom" required/>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input th:field="*{email}" type="email" placeholder="Email" required/>
                    </div>
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input th:field="*{telephone}" placeholder="Téléphone"/>
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <input th:field="*{adresse}" placeholder="Adresse"/>
                    </div>
                    <div class="form-group">
                        <label>Rôle</label>
                        <select th:field="*{role}">
                            <option value="ADMIN">ADMIN</option>
                            <option value="DOCTORANT">DOCTORANT</option>
                            <option value="ENCADRANT">ENCADRANT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input th:field="*{password}" type="password" placeholder="Mot de passe"/>
                    </div>
                </div>
            </form>
        </div>

        <div class="form-card-foot">
            <a th:href="@{/admin/users}" class="back-link">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
            <button type="submit"
                    onclick="this.closest('.form-card').querySelector('form').submit()"
                    class="btn-primary">
                <i class="fas fa-floppy-disk"></i> Enregistrer
            </button>
        </div>
    </div>

</section>
</body>
</html>
