<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/admin-layout :: layout(
          ${Utilisateur.prenom + ' ' + Utilisateur.nom},
          'Détails du compte utilisateur',
          'users'
      )}">
<head><title>Détails utilisateur</title></head>
<body>

<section th:fragment="content">
    <style>
        /* ── TOPBAR ──────────────────────────────────────────────── */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }
        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: .75rem; color: var(--muted); text-decoration: none;
            padding: 6px 13px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface); transition: all .13s;
        }
        .btn-back:hover { color: var(--accent); border-color: #c7d9fd; background: #eff6ff; }

        /* ── PROFILE HEADER ──────────────────────────────────────── */
        .profile-header {
            background: var(--navy); padding: 24px 28px;
            display: flex; align-items: center; gap: 16px;
        }
        .avatar-circle {
            width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
            background: rgba(59,110,244,.2); border: 1.5px solid rgba(59,110,244,.35);
            display: flex; align-items: center; justify-content: center;
            color: #93b4fd; font-size: 1.1rem; font-weight: 700;
        }
        .profile-name { font-size: .95rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
        .profile-email { font-size: .73rem; color: rgba(255,255,255,.45); margin-bottom: 7px; }
        .role-pill {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(59,110,244,.18); border: 1px solid rgba(59,110,244,.28);
            color: #93b4fd; font-size: .61rem; font-weight: 600; letter-spacing: .07em;
            text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
        }

        /* ── FIELDS ──────────────────────────────────────────────── */
        .field-row {
            display: flex; align-items: center;
            padding: 13px 28px; border-bottom: 1px solid var(--border);
            transition: background .1s;
        }
        .field-row:last-child { border-bottom: none; }
        .field-row:hover { background: #fafbff; }
        .field-icon {
            width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: .78rem; margin-right: 14px;
        }
        .field-icon.blue   { background: #eff6ff; color: var(--accent); }
        .field-icon.green  { background: #f0fdf4; color: var(--success); }
        .field-icon.amber  { background: #fffbeb; color: var(--warning); }
        .field-icon.purple { background: #f5f3ff; color: #7c3aed; }
        .field-icon.teal   { background: #ecfeff; color: var(--info); }

        .field-label {
            font-size: .7rem; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px;
        }
        .field-value { font-size: .85rem; color: var(--text); font-weight: 500; }
        .field-value.empty { color: var(--muted); font-style: italic; font-weight: 400; }

        /* ── ROLE BADGES ─────────────────────────────────────────── */
        .badge-role {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: .68rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
        }
        .badge-admin     { background: #eff6ff; color: var(--accent); }
        .badge-doctorant { background: #f5f3ff; color: #7c3aed; }
        .badge-encadrant { background: #ecfeff; color: var(--info); }
        .badge-default   { background: var(--bg); color: var(--muted); }

        /* ── CARD ACTIONS ────────────────────────────────────────── */
        .card-actions {
            padding: 14px 28px; border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px; background: var(--bg);
        }
        .btn-action {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: .78rem; font-weight: 600; padding: 7px 16px; border-radius: 6px;
            text-decoration: none; border: 1px solid; cursor: pointer;
            font-family: inherit; transition: all .13s;
        }
        .btn-edit   { background: var(--navy); color: #fff; border-color: var(--navy); }
        .btn-edit:hover { filter: brightness(1.15); }
        .btn-delete { background: transparent; color: var(--danger); border-color: #fecaca; }
        .btn-delete:hover { background: #fef2f2; }
    </style>

    <!-- TOPBAR -->
    <div class="topbar">
        <div></div><!-- spacer so btn-back floats right -->
        <a th:href="@{/admin/users}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Retour
        </a>
    </div>

    <!-- DETAIL CARD -->
    <div class="card">

        <!-- Profile header -->
        <div class="profile-header">
            <div class="avatar-circle">
                <span th:text="${#strings.substring(Utilisateur.prenom,0,1) + #strings.substring(Utilisateur.nom,0,1)}">NP</span>
            </div>
            <div>
                <div class="profile-name" th:text="${Utilisateur.prenom + ' ' + Utilisateur.nom}">Nom Prénom</div>
                <div class="profile-email" th:if="${Utilisateur.email != null}" th:text="${Utilisateur.email}">email@univ.ma</div>
                <span class="role-pill" th:if="${Utilisateur.role != null}" th:text="${Utilisateur.role}">ROLE</span>
            </div>
        </div>

        <!-- Fields -->
        <div>
            <div class="field-row">
                <div class="field-icon blue"><i class="fas fa-user"></i></div>
                <div>
                    <div class="field-label">Nom</div>
                    <div th:class="${Utilisateur.nom == null} ? 'field-value empty' : 'field-value'"
                         th:text="${Utilisateur.nom != null ? Utilisateur.nom : 'Non renseigné'}">—</div>
                </div>
            </div>

            <div class="field-row">
                <div class="field-icon blue"><i class="fas fa-id-card"></i></div>
                <div>
                    <div class="field-label">Prénom</div>
                    <div th:class="${Utilisateur.prenom == null} ? 'field-value empty' : 'field-value'"
                         th:text="${Utilisateur.prenom != null ? Utilisateur.prenom : 'Non renseigné'}">—</div>
                </div>
            </div>

            <div class="field-row">
                <div class="field-icon teal"><i class="fas fa-envelope"></i></div>
                <div>
                    <div class="field-label">Email</div>
                    <div th:class="${Utilisateur.email == null} ? 'field-value empty' : 'field-value'"
                         th:text="${Utilisateur.email != null ? Utilisateur.email : 'Non renseigné'}">—</div>
                </div>
            </div>

            <div class="field-row">
                <div class="field-icon amber"><i class="fas fa-location-dot"></i></div>
                <div>
                    <div class="field-label">Adresse</div>
                    <div th:class="${Utilisateur.adresse == null} ? 'field-value empty' : 'field-value'"
                         th:text="${Utilisateur.adresse != null ? Utilisateur.adresse : 'Non renseigné'}">—</div>
                </div>
            </div>

            <div class="field-row">
                <div class="field-icon green"><i class="fas fa-phone"></i></div>
                <div>
                    <div class="field-label">Téléphone</div>
                    <div th:class="${Utilisateur.telephone == null} ? 'field-value empty' : 'field-value'"
                         th:text="${Utilisateur.telephone != null ? Utilisateur.telephone : 'Non renseigné'}">—</div>
                </div>
            </div>

            <div class="field-row">
                <div class="field-icon purple"><i class="fas fa-shield-halved"></i></div>
                <div>
                    <div class="field-label">Rôle</div>
                    <span th:if="${Utilisateur.role != null}"
                          th:class="${Utilisateur.role == 'ADMIN'}     ? 'badge-role badge-admin'     :
                          (${Utilisateur.role == 'DOCTORANT'} ? 'badge-role badge-doctorant' :
                          (${Utilisateur.role == 'ENCADRANT'} ? 'badge-role badge-encadrant' :
                                                                 'badge-role badge-default'))"
                          th:text="${Utilisateur.role}">ROLE</span>
                    <div th:unless="${Utilisateur.role != null}" class="field-value empty">Non renseigné</div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="card-actions">
            <a th:href="@{/Utilisateur/update/{id}(id=${Utilisateur.id})}" class="btn-action btn-edit">
                <i class="fas fa-pen"></i> Modifier
            </a>
            <button class="btn-action btn-delete"
                    onclick="confirm('Supprimer cet utilisateur ?') && (window.location = this.dataset.url)"
                    th:data-url="@{/Utilisateur/delete/{id}(id=${Utilisateur.id})}">
                <i class="fas fa-trash"></i> Supprimer
            </button>
        </div>

    </div>

</section>
</body>
</html>
