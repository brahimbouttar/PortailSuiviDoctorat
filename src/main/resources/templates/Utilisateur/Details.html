<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Détails utilisateur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0" th:text="${Utilisateur.prenom + ' ' + Utilisateur.nom}">Utilisateur</h4>
            <small class="text-muted">Détails du compte utilisateur</small>
        </div>
        <a th:href="@{/Utilisateur/all}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Nom</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.nom != null ? Utilisateur.nom : '-'}">-</dd>

                <dt class="col-sm-3">Prénom</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.prenom != null ? Utilisateur.prenom : '-'}">-</dd>

                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.email != null ? Utilisateur.email : '-'}">-</dd>

                <dt class="col-sm-3">Adresse</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.adresse != null ? Utilisateur.adresse : '-'}">-</dd>

                <dt class="col-sm-3">Téléphone</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.telephone != null ? Utilisateur.telephone : '-'}">-</dd>

                <dt class="col-sm-3">Rôle</dt>
                <dd class="col-sm-9" th:text="${Utilisateur.role != null ? Utilisateur.role : '-'}">-</dd>
            </dl>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
