<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Liste Utilisateur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body { background:#f5f6fa; }
        .card { border-radius:10px; }
        .table th { font-size:0.8rem; text-transform:uppercase; }
    </style>
</head>
<body>
<div th:replace="~{/fragments/navbar::navbar}"></div>
<div class="container mt-4">

<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Utilisateur</h4>
    <a th:href="@{/Utilisateur/form}" class="btn btn-primary btn-sm">
        <i class="fas fa-plus"></i> Ajouter
    </a>
</div>
<!-- Search -->
<div class="mb-3">
    <input id="searchInput" class="form-control" placeholder="Rechercher..." oninput="filterTable()"/>
</div>




<br><br>

<!-- Table -->
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Email</th>
                <th>Adresse</th>
                <th>Telephone</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr th:each="u : ${Utilisateur}" th:onclick="|window.location.href='@{/Utilisateur/Details/{id}(id=${u.id})}'|" >
                <td th:text="${u.nom}"></td>
                <td th:text="${u.prenom}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.adresse}"></td>
                <td th:text="${u.telephone}"></td>
                <td class="text-center">
                    <a th:href="@{'/Utilisateur/update/' + ${u.id}}" class="btn btn-sm btn-primary" onclick="event.stopPropagation()">
                        <i class="fas fa-edit"></i>
                    </a>
                    <button class="btn btn-sm btn-danger"
                            th:onclick="'deleteUtilisateur(event, ' + ${u.id} + ')'">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(Utilisateur)}">
                <td colspan="6" class="text-center text-muted py-4">
                    Aucun Utilisateur trouvé.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</div>
<script>
    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    function deleteUtilisateur(event,id) {
        event.stopPropagation();
        if (!confirm('Supprimer ce Utilisateur ?')) return;
        fetch(`/Utilisateur/delete/${id}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok){
                    location.reload()
                }else{
                    alert('Erreur lors de la suppression.');
                }
            });
    }
</script>
</body>
</html>
