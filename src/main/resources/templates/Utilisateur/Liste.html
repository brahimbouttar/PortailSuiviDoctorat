<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste Utilisateurs</title>
</head>
<body>
<div th:replace="~{/fragments/navbar::navbar}"></div>

<h2>Liste des Utilisateurs</h2>

<!-- ADD BUTTON -->
<a href="/Utilisateur/create">
    <button>Ajouter Utilisateur</button>
</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prenom</th>
        <th>Email</th>
        <th>Adresse</th>
        <th>Telephone</th>
        <th>Actions</th>
    </tr>

    <!-- LOOP -->
    <tr th:each="u : ${Utilisateur}" th:onclick="|window.location.href='@{/Utilisateur/Details/{id}(id=${u.id})}'|" >
        <td th:text="${u.id}"></td>
        <td th:text="${u.nom}"></td>
        <td th:text="${u.prenom}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.adresse}"></td>
        <td th:text="${u.telephone}"></td>

        <td>
            <!-- EDIT -->
            <a th:href="@{'/Utilisateur/update/' + ${u.id}}">
                <button>Edit</button>
            </a>

            <!-- DELETE -->
            <a th:href="@{'/Utilisateur/delete/' + ${u.id}}"
               onclick="return confirm('Are you sure?')">
                <button>Delete</button>
            </a>
        </td>
    </tr>

</table>

</body>
</html>
