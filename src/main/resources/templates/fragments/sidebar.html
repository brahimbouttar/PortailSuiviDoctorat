<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<div th:fragment="sidebar">
    <div class="d-flex flex-column flex-shrink-0 text-white sticky-top vh-100"
         style="width:230px; background:#1a1f2e;">

        <!-- Brand -->
        <a th:href="@{/dashboard}"
           class="d-flex align-items-center gap-2 px-3 py-3 text-white text-decoration-none border-bottom border-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#818cf8" viewBox="0 0 16 16">
                <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0 2 0V6a.5.5 0 0 0-.309-.462l-7.5-3.5z"/>
                <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.5 4.176 9.032z"/>
            </svg>
            <span class="fw-semibold" style="font-size:14px;">Portail Doctorat</span>
        </a>

        <!-- Section : Mon parcours -->
        <div class="px-3 pt-3 pb-1">
      <span class="text-uppercase fw-semibold"
            style="font-size:10px;letter-spacing:.08em;color:rgba(255,255,255,0.3);">Mon parcours</span>
        </div>
        <ul class="nav nav-pills flex-column px-2 gap-1">
            <li class="nav-item">
                <a th:href="@{/dashboard}"
                   class="nav-link d-flex align-items-center gap-2 text-white py-2"
                   th:classappend="${currentPage == 'dashboard'} ? ' active' : ' opacity-50'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 3.293 1 9.5V15h5v-4h4v4h5V9.5L8 3.293zM8 1.5l7.5 6.8-.966 1.065L8 3.414 1.466 9.365.5 8.3 8 1.5z"/>
                    </svg>
                    Tableau de bord
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/dossiers}"
                   class="nav-link d-flex align-items-center gap-2 text-white py-2"
                   th:classappend="${currentPage == 'dossiers'} ? ' active' : ' opacity-50'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M4 0h5.293A1 1 0 0 1 10 .293L13.707 4a1 1 0 0 1 .293.707V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5.5 1.5v2a1 1 0 0 0 1 1h2L9.5 1.5z"/>
                    </svg>
                    Mes dossiers
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/manuscrit}"
                   class="nav-link d-flex align-items-center gap-2 text-white py-2"
                   th:classappend="${currentPage == 'manuscrit'} ? ' active' : ' opacity-50'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                        <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                    </svg>
                    Manuscrit de thèse
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/avancement}"
                   class="nav-link d-flex align-items-center gap-2 text-white py-2"
                   th:classappend="${currentPage == 'avancement'} ? ' active' : ' opacity-50'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 0h1v15h15v1H0V0Zm10 3.5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4.9l-3.613 4.417a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61L13.445 4H10.5a.5.5 0 0 1-.5-.5Z"/>
                    </svg>
                    Avancement
                </a>
            </li>
        </ul>



        <!-- Pied de sidebar -->
        <div class="mt-auto border-top border-secondary px-2 py-2">
            <a th:href="@{/profil}"
               class="nav-link d-flex align-items-center gap-2 text-white opacity-50 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4z"/>
                </svg>
                Mon profil
            </a>
            <a th:href="@{/logout}"
               class="nav-link d-flex align-items-center gap-2 text-danger py-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                    <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                </svg>
                Déconnexion
            </a>
        </div>

    </div>
</div>

</body>
</html>
