<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layouts/encadrant-layout :: layout(
          'Tableau de bord',
          'Vue d\'ensemble de la gestion des encadrants et des formations doctorales',
          'dashboard'
      )}">
<head><title>Tableau de bord Encadrant</title></head>
<body>

<section th:fragment="section">

    <div class="kpi-grid">
        <div class="kpi">
            <div class="kpi-icon teal"><i class="fas fa-chalkboard-teacher"></i></div>
            <div>
                <div class="kpi-val" th:text="${totalEncadrants}">0</div>
                <div class="kpi-lbl">Encadrants au total</div>
            </div>
        </div>
        <div class="kpi">
            <div class="kpi-icon blue"><i class="fas fa-flask"></i></div>
            <div>
                <div class="kpi-val" th:text="${totalSpecialites}">0</div>
                <div class="kpi-lbl">Spécialités distinctes</div>
            </div>
        </div>
        <div class="kpi">
            <div class="kpi-icon amber"><i class="fas fa-medal"></i></div>
            <div>
                <div class="kpi-val" th:text="${totalGrades}">0</div>
                <div class="kpi-lbl">Grades différents</div>
            </div>
        </div>
        <div class="kpi">
            <div class="kpi-icon green"><i class="fas fa-university"></i></div>
            <div>
                <div class="kpi-val" th:text="${totalEtablissements}">0</div>
                <div class="kpi-lbl">Établissements</div>
            </div>
        </div>
    </div>

    <!-- BANNER -->
    <div class="banner">
        <div>
            <div class="banner-tag"><i class="fas fa-users-cog"></i> Gestion des encadrants</div>
            <h2>Gérez vos encadrants en toute simplicité</h2>
            <p>Consultez, ajoutez, modifiez ou supprimez des encadrants depuis la liste complète.</p>
        </div>
        <div class="banner-btns">
            <a th:href="@{/encadrant/liste}" class="btn-primary">
                <i class="fas fa-arrow-right"></i> Accéder à la liste
            </a>
            <a th:href="@{/encadrant/nouveau}" class="btn-ghost-dark">
                <i class="fas fa-plus"></i> Nouvel encadrant
            </a>
        </div>
    </div>

</section>
</body>
</html>
