<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — Portail Doctorat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: linear-gradient(135deg,#0d6efd 0%,#0a58ca 100%); min-height:100vh; display:flex; align-items:center; }
    .login-card { border:none; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.2); max-width:420px; width:100%; }
    .login-header { background:#0d6efd; color:#fff; border-radius:16px 16px 0 0; padding:2rem; text-align:center; }
    .login-header i { font-size:2.5rem; }
    .form-control:focus { border-color:#0d6efd; box-shadow:0 0 0 .2rem rgba(13,110,253,.2); }
    .btn-login { background:#0d6efd; color:#fff; border:none; border-radius:8px; padding:.7rem; font-weight:600; width:100%; }
    .btn-login:hover { background:#0a58ca; color:#fff; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card login-card">
        <div class="login-header">
          <i class="bi bi-mortarboard-fill"></i>
          <h4 class="mt-2 mb-0 fw-bold">Portail Doctorat</h4>
          <small class="opacity-75">Système de suivi doctoral</small>
        </div>
        <div class="card-body p-4">

          <div th:if="${successMessage}" class="alert alert-success py-2 mb-3">
            <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
          </div>
          <div th:if="${errorMessage}" class="alert alert-danger py-2 mb-3">
            <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
          </div>

          <form action="/login" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold" style="font-size:.85rem;">Adresse email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="exemple@univ.ma" required/>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" style="font-size:.85rem;">Mot de passe</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
              </div>
            </div>
            <button type="submit" class="btn btn-login">
              <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
          </form>

          <hr class="my-3"/>
          <p class="text-center text-muted mb-0" style="font-size:.85rem;">
            Pas encore de compte ?
            <a th:href="@{/inscription}" class="text-primary fw-semibold">S'inscrire</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
