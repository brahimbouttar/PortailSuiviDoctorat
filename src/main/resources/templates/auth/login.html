<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — Portail Doctorat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --navy:    hsl(225.79deg 42.22% 17.65%);
      --accent:  hsl(226deg 88% 60%);
      --success: hsl(142deg 72% 36%);
      --danger:  hsl(0deg 72% 51%);
      --bg:      hsl(226deg 30% 96%);
      --surface: hsl(0deg 0% 100%);
      --border:  hsl(226deg 25% 90%);
      --text:    hsl(225.79deg 42.22% 17.65%);
      --muted:   hsl(220deg 9% 46%);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }

    .card-top {
      height: 4px;
      background: linear-gradient(90deg, var(--accent), hsl(226deg 88% 72%));
    }

    .card-body { padding: 36px 32px 32px; }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .9rem; flex-shrink: 0;
    }
    .brand-name { font-size: .9rem; font-weight: 700; color: var(--text); }
    .brand-sub  { font-size: .68rem; color: var(--muted); margin-top: 1px; }

    .login-title { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .login-sub   { font-size: .75rem; color: var(--muted); margin-bottom: 24px; }

    .alert {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; border-radius: 7px;
      font-size: .78rem; margin-bottom: 18px;
    }
    .alert-success { background: hsl(142deg 72% 96%); border: 1px solid hsl(142deg 72% 80%); color: var(--success); }
    .alert-danger  { background: hsl(0deg 72% 97%);   border: 1px solid hsl(0deg 72% 85%);   color: var(--danger); }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: .75rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    .input-wrap {
      display: flex; align-items: center;
      border: 1px solid var(--border); border-radius: 7px;
      background: var(--surface); transition: border-color .15s; overflow: hidden;
    }
    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px hsl(226deg 88% 60% / .12);
    }
    .input-wrap i { padding: 0 12px; color: var(--muted); font-size: .8rem; flex-shrink: 0; }
    .input-wrap input {
      flex: 1; border: none; outline: none;
      padding: 10px 12px 10px 0;
      font-size: .83rem; color: var(--text);
      background: transparent; font-family: inherit;
    }
    .input-wrap input::placeholder { color: hsl(220deg 9% 75%); }

    .btn-submit {
      width: 100%; margin-top: 8px; padding: 10px;
      background: var(--navy); color: #fff;
      border: none; border-radius: 7px;
      font-size: .85rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: filter .13s;
    }
    .btn-submit:hover { filter: brightness(1.15); }

    .card-footer {
      border-top: 1px solid var(--border);
      padding: 14px 32px; text-align: center;
      font-size: .7rem; color: var(--muted);
      background: var(--bg);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-top"></div>
  <div class="card-body">

    <div class="brand">
      <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
      <div>
        <div class="brand-name">Portail Doctorat</div>
        <div class="brand-sub">Système de suivi doctoral</div>
      </div>
    </div>

    <div class="login-title">Connexion</div>
    <div class="login-sub">Entrez vos identifiants pour accéder à votre espace</div>

    <div class="alert alert-success" th:if="${successMessage}">
      <i class="fas fa-circle-check"></i>
      <span th:text="${successMessage}"></span>
    </div>
    <div class="alert alert-danger" th:if="${errorMessage}">
      <i class="fas fa-triangle-exclamation"></i>
      <span th:text="${errorMessage}"></span>
    </div>

    <form action="/login" method="post">
      <div class="field">
        <label>Adresse email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="exemple@univ.ma" required/>
        </div>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="••••••••" required/>
        </div>
      </div>
      <button type="submit" class="btn-submit">
        <i class="fas fa-arrow-right-to-bracket"></i> Se connecter
      </button>
    </form>

  </div>
  <div class="card-footer">Portail réservé aux membres accrédités — © 2025</div>
</div>

</body>
</html>
