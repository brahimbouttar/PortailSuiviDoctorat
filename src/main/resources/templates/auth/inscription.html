<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription — Portail Doctorat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background:#f0f4f8; }
    .card { border:none; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    .card-header { background:#0d6efd; color:#fff; border-radius:12px 12px 0 0; }
    .form-label { font-size:.8rem; font-weight:600; color:#495057; }
    .form-control:focus { border-color:#0d6efd; box-shadow:0 0 0 .2rem rgba(13,110,253,.15); }
    .section-title { font-size:.85rem; font-weight:700; color:#0d6efd; text-transform:uppercase; letter-spacing:.06em; border-bottom:2px solid #e8f0fe; padding-bottom:.4rem; margin-bottom:1rem; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width:750px;">
  <div class="text-center mb-4">
    <i class="bi bi-mortarboard-fill text-primary" style="font-size:2rem;"></i>
    <h4 class="fw-bold text-primary mt-1">Inscription — Portail Doctorat</h4>
    <p class="text-muted">Créez votre compte doctorant</p>
  </div>

  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card">
    <div class="card-header py-3 px-4">
      <h5 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Formulaire d'inscription</h5>
    </div>
    <div class="card-body p-4">
      <form action="/inscription" method="post" novalidate>

        <!-- Informations personnelles -->
        <p class="section-title"><i class="bi bi-person me-1"></i>Informations personnelles</p>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label">Nom <span class="text-danger">*</span></label>
            <input type="text" name="nom" class="form-control" placeholder="Votre nom" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Prénom <span class="text-danger">*</span></label>
            <input type="text" name="prenom" class="form-control" placeholder="Votre prénom" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="exemple@univ.ma" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Téléphone</label>
            <input type="tel" name="telephone" class="form-control" placeholder="06XXXXXXXX"/>
          </div>
          <div class="col-12">
            <label class="form-label">Adresse</label>
            <input type="text" name="adresse" class="form-control" placeholder="Adresse complète"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirmer le mot de passe <span class="text-danger">*</span></label>
            <input type="password" id="confirmPwd" class="form-control" placeholder="••••••••" required/>
          </div>
        </div>

        <!-- Informations doctorat -->
        <p class="section-title"><i class="bi bi-book me-1"></i>Informations doctorat</p>
        <div class="row g-3 mb-4">
          <div class="col-12">
            <label class="form-label">Sujet de thèse <span class="text-danger">*</span></label>
            <textarea name="sujetThese" class="form-control" rows="2"
                      placeholder="Titre ou sujet de votre thèse de doctorat" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">CV (lien ou référence)</label>
            <input type="text" name="CV" class="form-control" placeholder="Lien vers votre CV"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Lettre de motivation (lien ou référence)</label>
            <input type="text" name="lettreMotivation" class="form-control" placeholder="Lien vers votre lettre"/>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center">
          <a th:href="@{/login}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
          </a>
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-send me-1"></i>Soumettre l'inscription
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    const pwd  = document.querySelector('[name="password"]').value;
    const conf = document.getElementById('confirmPwd').value;
    if (pwd !== conf) {
      e.preventDefault();
      alert('Les mots de passe ne correspondent pas.');
    }
  });
</script>
</body>
</html>
