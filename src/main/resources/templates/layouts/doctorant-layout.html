<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:fragment="layout(pageTitle, pageSubtitle, activePage)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' — Portail Doctorat'">Doctorant — Portail Doctorat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --navy:    #1a2340;
      --accent:  #7c3aed;
      --success: #16a34a;
      --warning: #d97706;
      --danger:  #dc2626;
      --blue:    #3b6ef4;
      --info:    #0891b2;
      --bg:      #f4f6fb;
      --surface: #ffffff;
      --border:  #e5e9f2;
      --text:    #1a2340;
      --muted:   #6b7280;
      --sw:      240px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; min-height: 100vh; font-size: 14px;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sw); background: var(--navy); min-height: 100vh;
      position: fixed; top: 0; left: 0; bottom: 0;
      display: flex; flex-direction: column; z-index: 100;
    }
    .sb-brand {
      padding: 22px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex; align-items: center; gap: 11px;
    }
    .sb-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: .82rem; flex-shrink: 0;
    }
    .sb-title { font-size: .85rem; font-weight: 600; color: #fff; }
    .sb-sub   { font-size: .63rem; color: rgba(255,255,255,.32); margin-top: 1px; }
    .sb-role  {
      margin: 10px 18px 0;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.28);
      color: #c4b5fd; font-size: .61rem; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 20px;
    }
    .sb-nav { flex: 1; padding: 14px 8px; overflow-y: auto; }
    .sb-section {
      font-size: .57rem; font-weight: 700; letter-spacing: .12em;
      color: rgba(255,255,255,.2); text-transform: uppercase; padding: 12px 10px 4px;
    }
    .sb-link {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 6px;
      color: rgba(255,255,255,.45); text-decoration: none;
      font-size: .79rem; font-weight: 500; transition: all .13s;
    }
    .sb-link i { width: 14px; text-align: center; font-size: .76rem; flex-shrink: 0; }
    .sb-link:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.82); }
    .sb-link.active {
      background: rgba(124,58,237,.13); color: #fff;
      border-left: 2px solid var(--accent); padding-left: 8px;
    }
    .sb-link.active i { color: var(--accent); }
    .sb-footer {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.07);
      display: flex; align-items: center; gap: 9px;
    }
    .sb-avatar {
      width: 28px; height: 28px; border-radius: 6px;
      background: rgba(255,255,255,.1); display: flex; align-items: center;
      justify-content: center; color: rgba(255,255,255,.65);
      font-size: .65rem; font-weight: 700; flex-shrink: 0;
    }
    .sb-uname { font-size: .75rem; color: rgba(255,255,255,.78); font-weight: 600; }
    .sb-urole { font-size: .61rem; color: rgba(255,255,255,.3); }
    .sb-logout {
      margin-left: auto; background: transparent; border: none;
      color: rgba(255,255,255,.25); cursor: pointer; font-size: .72rem;
      padding: 4px; transition: color .13s;
    }
    .sb-logout:hover { color: #f87171; }

    /* ── MAIN ────────────────────────────────────────────── */
    .main { margin-left: var(--sw); flex: 1; padding: 30px 32px; min-width: 0; }
    .page-title { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .page-sub   { font-size: .76rem; color: var(--muted); margin-bottom: 24px; }

    /* ── ALERT ───────────────────────────────────────────── */
    .alert-warn {
      display: flex; align-items: flex-start; gap: 10px;
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px;
      padding: 12px 16px; margin-bottom: 20px; font-size: .8rem; line-height: 1.5;
    }
    .alert-warn i { color: var(--warning); flex-shrink: 0; margin-top: 1px; }
    .alert-warn a { color: var(--blue); font-weight: 600; text-decoration: none; }

    /* ── KPI ─────────────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
      padding: 16px 14px; display: flex; align-items: center; gap: 12px;
    }
    .kpi-icon {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: .9rem;
    }
    .kpi-icon.violet { background: #f5f3ff; color: var(--accent); }
    .kpi-icon.green  { background: #f0fdf4; color: var(--success); }
    .kpi-icon.amber  { background: #fffbeb; color: var(--warning); }
    .kpi-icon.blue   { background: #eff6ff; color: var(--blue); }
    .kpi-val { font-size: 1.55rem; font-weight: 700; color: var(--text); line-height: 1; }
    .kpi-lbl { font-size: .7rem; color: var(--muted); margin-top: 2px; }
    .kpi-sub { font-size: .68rem; margin-top: 1px; }
    .kpi-sub.s { color: var(--success); }
    .kpi-sub.w { color: var(--warning); }
    .kpi-sub.m { color: var(--muted); }
    .pbar      { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 5px; }
    .pbar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

    /* ── BOTTOM GRID ─────────────────────────────────────── */
    .bottom { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }

    /* ── CARD ────────────────────────────────────────────── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .card + .card { margin-top: 16px; }
    .card-head {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-head h6 { font-size: .83rem; font-weight: 600; color: var(--text); }
    .link-btn {
      font-size: .71rem; color: var(--muted); text-decoration: none;
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); transition: all .13s; display: inline-flex; align-items: center; gap: 5px;
    }
    .link-btn:hover { color: var(--accent); border-color: #ddd6fe; background: #f5f3ff; }

    /* ── DOSSIER ROWS ────────────────────────────────────── */
    .drow {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 18px; border-bottom: 1px solid var(--border); transition: background .1s;
    }
    .drow:last-child { border-bottom: none; }
    .drow:hover { background: #fafbff; }
    .step {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .68rem; font-weight: 700; flex-shrink: 0;
    }
    .step.v { background: #f0fdf4; color: var(--success); }
    .step.a { background: #fffbeb; color: var(--warning); }
    .step.d { background: var(--bg); color: var(--muted); }
    .drow-info { flex: 1; min-width: 0; }
    .drow-info p     { font-size: .81rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drow-info small { font-size: .7rem; color: var(--muted); }

    /* ── BADGES ──────────────────────────────────────────── */
    .badge {
      display: inline-block; font-size: .64rem; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    }
    .badge-success { background: #f0fdf4; color: #16a34a; }
    .badge-warning { background: #fffbeb; color: #d97706; }
    .badge-danger  { background: #fef2f2; color: #dc2626; }
    .badge-muted   { background: var(--bg); color: var(--muted); }

    /* ── MANUSCRIT ───────────────────────────────────────── */
    .m-empty { padding: 14px 18px; font-size: .79rem; color: var(--muted); font-style: italic; }
    .upload-btn {
      margin: 0 18px 14px; display: flex; align-items: center; justify-content: center; gap: 7px;
      border: 1.5px dashed var(--border); border-radius: 7px;
      padding: 10px; font-size: .77rem; color: var(--muted);
      text-decoration: none; background: var(--bg); transition: all .15s; cursor: pointer;
    }
    .upload-btn:hover { border-color: var(--accent); color: var(--accent); background: #f5f3ff; }

    /* ── ECHEANCES ───────────────────────────────────────── */
    .erow {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 11px 16px; border-bottom: 1px solid var(--border);
    }
    .erow:last-child { border-bottom: none; }
    .edot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .edot.urg { background: var(--danger); }
    .edot.def { background: var(--accent); }
    .edot.doc { background: var(--blue); }
    .edot.oth { background: var(--warning); }
    .erow p     { font-size: .8rem; font-weight: 600; margin-bottom: 1px; }
    .erow small { font-size: .7rem; color: var(--muted); }
    .erow small.urg { color: var(--danger); font-weight: 600; }
    .e-empty { padding: 14px 16px; font-size: .78rem; color: var(--muted); font-style: italic; }

    /* ── BTN PRIMARY ─────────────────────────────────────── */
    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      padding: 7px 14px; border-radius: 6px; font-size: .78rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .13s;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 11px; border-radius: 6px; font-size: .75rem; font-weight: 500;
      cursor: pointer; transition: all .13s;
    }
    .btn-ghost:hover { border-color: #ddd6fe; color: var(--accent); background: #f5f3ff; }

    /* ── TABLE ───────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: .64rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
      color: var(--muted); padding: 9px 16px; background: var(--bg);
      border-bottom: 1px solid var(--border); text-align: left;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }
    td { padding: 11px 16px; vertical-align: middle; font-size: .82rem; }

    /* ── ACT BUTTONS ─────────────────────────────────────── */
    .act { display: flex; gap: 5px; }
    .act-btn {
      width: 26px; height: 26px; border-radius: 5px; border: 1px solid;
      background: transparent; cursor: pointer; font-size: .72rem;
      display: flex; align-items: center; justify-content: center; transition: all .1s;
    }
    .act-btn.ok { border-color: #ddd6fe; color: var(--accent); }
    .act-btn.ok:hover { background: #f5f3ff; }
    .act-btn.no { border-color: #fecaca; color: var(--danger); }
    .act-btn.no:hover { background: #fef2f2; }

    /* ── MODAL ───────────────────────────────────────────── */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,20,35,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--surface); border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.18); animation: modalIn .18s ease; }
    @keyframes modalIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-head { padding: 15px 20px; background: var(--navy); border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 9px; color: #fff; flex-shrink: 0; }
    .modal-head h5 { font-size: .88rem; font-weight: 600; margin: 0; flex: 1; }
    .modal-head .close-btn { background: none; border: none; color: rgba(255,255,255,.45); font-size: .85rem; cursor: pointer; padding: 2px 5px; transition: color .12s; }
    .modal-head .close-btn:hover { color: #fff; }
    .modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
    .modal-foot { padding: 13px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg); border-radius: 0 0 10px 10px; flex-shrink: 0; }

    /* ── FORM ────────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { font-size: .71rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .form-group input {
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
      font-size: .81rem; color: var(--text); background: var(--surface);
      font-family: inherit; transition: border-color .12s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.1); }

    /* ── SEARCH ──────────────────────────────────────────── */
    .search-bar { position: relative; }
    .search-bar i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .78rem; pointer-events: none; }
    .search-bar input {
      width: 100%; padding: 8px 12px 8px 32px;
      border: 1px solid var(--border); border-radius: 7px;
      font-size: .81rem; color: var(--text); background: var(--surface);
      font-family: inherit; transition: border-color .12s;
    }
    .search-bar input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.1); }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(2,1fr); } .bottom { grid-template-columns: 1fr; } }
    @media (max-width: 768px)  { .sidebar { display: none; } .main { margin-left: 0; padding: 20px; } }
    @media (max-width: 560px)  { .kpi-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-icon"><i class="fas fa-graduation-cap"></i></div>
    <div>
      <div class="sb-title">Portail Doctorat</div>
      <div class="sb-sub">Gestion académique</div>
    </div>
  </div>
  <div class="sb-role"><i class="fas fa-user-graduate"></i> Doctorant</div>

  <nav class="sb-nav">
    <div class="sb-section">Principal</div>
    <a th:href="@{/doctorants}"
       th:class="${activePage == 'dashboard'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-house"></i> Tableau de bord
    </a>

    <div class="sb-section">Mon dossier</div>
    <a th:href="@{/Diplomes}"
       th:class="${activePage == 'dossiers'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-folder-open"></i> Dossiers
    </a>
    <a th:href="@{/doctorants/soutenance}"
       th:class="${activePage == 'soutenance'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-calendar-check"></i> Ma soutenance
    </a>
    <a th:href="@{/doctorants/demandes}"
       th:class="${activePage == 'demandes'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-inbox"></i> Mes demandes
    </a>

    <div class="sb-section">Compte</div>
    <a th:href="@{/profil}"
       th:class="${activePage == 'profil'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-circle-user"></i> Mon profil
    </a>
    <a th:href="@{/messages}"
       th:class="${activePage == 'messages'} ? 'sb-link active' : 'sb-link'">
      <i class="fas fa-comments"></i> Communication
    </a>
  </nav>

  <div class="sb-footer">
    <div class="sb-avatar">DC</div>
    <div>
      <div class="sb-uname"
           th:text="${doctorant != null ? doctorant.prenom + ' ' + doctorant.nom : 'Doctorant'}">Nom Prénom</div>
      <div class="sb-urole">Doctorant</div>
    </div>
    <a th:href="@{/logout}" class="sb-logout" title="Déconnexion">
      <i class="fas fa-right-from-bracket"></i>
    </a>
  </div>
</aside>

<main class="main">
  <div class="page-title" th:text="${pageTitle}">Doctorant</div>
  <div class="page-sub"   th:text="${pageSubtitle}">Portail doctoral</div>

  <th:block th:replace="~{::section}"></th:block>
</main>

</body>
</html>
